name: coast-27aug26
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  # Binary dependencies better handled by conda than pip:
  - cartopy=0.23.0
  - netcdf4=1.5.8
  - h5py=3.6.0
  - hdf5
  - pip:
    # Installs coast + all its Python dependencies declared in setup.py
    - -e .