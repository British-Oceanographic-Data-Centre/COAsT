name: Build Python package

on:
  push:
    branches-ignore:
      master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip virtualenv
          CONDA_BASE=$(conda info --base)
          source "${CONDA_BASE}/etc/profile.d/conda.sh"
          conda env update --prune --file environment.yml
          conda install conda-forge::hdf5
          conda activate coast
      - name: Shell Script Permissions
        run: |
          chmod +x *.sh
      - name: Setup Environment
        run: |
          ./setup_environment.sh
      - name: Build Package
        run: |
          CONDA_BASE=$(conda info --base)
          source "${CONDA_BASE}/etc/profile.d/conda.sh"
          conda init
          conda activate coast
          ./build.sh
      - name: Test Package Install
        run: |
          sudo apt-get update && sudo apt-get install -y libhdf5-dev libnetcdf-dev
          CONDA_BASE=$(conda info --base)
          source "${CONDA_BASE}/etc/profile.d/conda.sh"
          conda init
          conda activate coast
          python -m pip install dist/coast-*.tar.gz
      - name: Generate Conda Metadata
        run: |
          ./generate_conda_meta.sh
          cat conda/meta.yaml
